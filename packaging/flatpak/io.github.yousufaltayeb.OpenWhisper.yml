app-id: io.github.yousufaltayeb.OpenWhisper
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable
metadata: flatpak-metadata
command: openwhisper
rename-icon: io.github.yousufaltayeb.OpenWhisper
add-extensions:
  io.github.yousufaltayeb.OpenWhisper.CohereLocal:
    directory: extensions/io.github.yousufaltayeb.OpenWhisper.CohereLocal
    bundle: true
    autodelete: false
    no-autodownload: true
  io.github.yousufaltayeb.OpenWhisper.Nvidia:
    directory: extensions/io.github.yousufaltayeb.OpenWhisper.Nvidia
    bundle: true
    autodelete: false
    no-autodownload: true
    # Keep vendor libraries out of the CPU image. When this signed extension
    # is present Flatpak adds only its lib directory to the loader path; the
    # engine still probes before selecting this backend.
    add-ld-path: lib
  io.github.yousufaltayeb.OpenWhisper.Amd:
    directory: extensions/io.github.yousufaltayeb.OpenWhisper.Amd
    bundle: true
    autodelete: false
    no-autodownload: true
    add-ld-path: lib
finish-args:
  # Model downloads and explicitly configured BYOK providers only. No
  # telemetry endpoint is present in the application.
  - --share=network
  - --share=ipc
  # Qt Multimedia reaches PipeWire/PulseAudio through this mediated socket.
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # AT-SPI is scoped to the accessibility bus; never grant the host/session bus.
  - --talk-name=org.a11y.Bus
  # Standard portal service only; this is not a broad session-bus grant. It is
  # used for the user-mediated Secret and Global Shortcuts portal requests.
  - --talk-name=org.freedesktop.portal.Desktop
  # Tauri's Linux notification backend uses the standard freedesktop
  # notification service directly. Keep this scoped to that single bus name.
  - --talk-name=org.freedesktop.Notifications
  # Qt registers tray items through the watcher; no arbitrary D-Bus name
  # ownership is required.
  - --talk-name=org.kde.StatusNotifierWatcher
  # One-time, read-only migration of the legacy Whisper preferences only.
  - --filesystem=xdg-config/whisper:ro
  - --env=OPENWHISPER_FLATPAK=1
  - --env=OPENWHISPER_COHERE_LOCAL_EXTENSION=/app/extensions/io.github.yousufaltayeb.OpenWhisper.CohereLocal
  - --env=OPENWHISPER_NVIDIA_EXTENSION=/app/extensions/io.github.yousufaltayeb.OpenWhisper.Nvidia
  - --env=OPENWHISPER_AMD_EXTENSION=/app/extensions/io.github.yousufaltayeb.OpenWhisper.Amd
  - --env=PYTHONNOUSERSITE=1
modules:
  # CPU-only llama.cpp is part of the core runtime for the managed private
  # Qwen3 editing pack. Vulkan/NVIDIA remains an opt-in experiment outside the
  # guaranteed x86_64 CPU path.
  - name: llama.cpp
    buildsystem: simple
    build-commands:
      - cmake -S . -B build -G Ninja -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DGGML_NATIVE=OFF -DGGML_VULKAN=OFF -DCMAKE_BUILD_TYPE=Release
      - cmake --build build --target llama-server
      - install -Dm755 build/bin/llama-server /app/bin/llama-server
      - install -Dm644 LICENSE /app/share/licenses/openwhisper/llama.cpp-LICENSE
    sources:
      - type: git
        url: https://github.com/ggml-org/llama.cpp.git
        commit: 11b068d06605288ce7917534b46d52b47823dc13
  - name: openwhisper
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin
      env:
        PYTHONNOUSERSITE: "1"
        CARGO_HOME: /run/build/openwhisper/cargo
        CARGO_NET_OFFLINE: "true"
        npm_config_cache: /run/build/openwhisper/flatpak-node/npm-cache
        npm_config_offline: "true"
        npm_config_audit: "false"
        npm_config_fund: "false"
    build-commands:
      # `prepare-sources.py` creates this locked wheelhouse before a release.
      # The builder is invoked with --disable-download in CI and release jobs.
      - "python3 -m pip install --only-binary=:all: --no-index --find-links=packaging/flatpak/wheels --prefix=/app -r packaging/flatpak/requirements-core.txt"
      - "python3 -m pip install --only-binary=:all: --no-deps --no-index --prefix=/app packaging/flatpak/wheels/openwhisper-*.whl"
      # Node and Rust are build-only SDK extensions. Both dependency graphs are
      # fetched as checksum-pinned Flatpak sources before the offline build.
      - npm --prefix frontend ci --offline --no-audit --no-fund
      - npm --prefix frontend run build
      - cargo --offline build --locked --release --features custom-protocol --manifest-path src-tauri/Cargo.toml
      # Replace the Python console script with the Tauri host; the private
      # openwhisper-engine entry point remains beside it under /app/bin.
      - install -Dm755 src-tauri/target/release/openwhisper /app/bin/openwhisper
      - install -Dm644 packaging/linux/io.github.yousufaltayeb.OpenWhisper.desktop /app/share/applications/io.github.yousufaltayeb.OpenWhisper.desktop
      - install -Dm644 packaging/linux/io.github.yousufaltayeb.OpenWhisper.metainfo.xml /app/share/metainfo/io.github.yousufaltayeb.OpenWhisper.metainfo.xml
      - install -Dm644 packaging/linux/io.github.yousufaltayeb.OpenWhisper.svg /app/share/icons/hicolor/scalable/apps/io.github.yousufaltayeb.OpenWhisper.svg
      - install -Dm644 frontend/public/licenses/Readex-Pro-OFL-1.1.txt /app/share/licenses/openwhisper/Readex-Pro-OFL-1.1.txt
      - install -Dm644 frontend/public/licenses/IBM-Plex-Mono-OFL-1.1.txt /app/share/licenses/openwhisper/IBM-Plex-Mono-OFL-1.1.txt
      - install -Dm644 LICENSE /app/share/licenses/openwhisper/LICENSE
      - install -Dm644 NOTICE.md /app/share/licenses/openwhisper/NOTICE.md
      - install -Dm644 packaging/flatpak/LICENSES.md /app/share/licenses/openwhisper/BUNDLED-LICENSES.md
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
      - npm-sources.json
  - name: openwhisper-cohere-local-extension
    buildsystem: simple
    build-commands:
      # Bundled extensions are exported as separate Flatpak refs. The files do
      # not enter the core app and no-autodownload keeps this pack opt-in.
      - install -d /app/extensions/io.github.yousufaltayeb.OpenWhisper.CohereLocal
      - "python3 -m pip install --only-binary=:all: --no-index --find-links=packaging/flatpak/wheels --prefix=/app/extensions/io.github.yousufaltayeb.OpenWhisper.CohereLocal -r packaging/flatpak/requirements-cohere-local.txt"
    sources:
      - type: dir
        path: ../..
