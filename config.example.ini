[whisper]
# Model size: tiny.en, base.en, small.en, medium.en, large-v3, large-v3-turbo
model = large-v3-turbo

# Device: cpu or cuda (cuda requires cuDNN)
device = cpu

# Compute type: int8 for CPU, float16 for GPU
compute_type = int8

# Language code (e.g. en, de, cs, or auto for detection)
language = en

# Force English-only decoding for better stability and fewer hallucinations
english_only = true

# Minimum chunk size in seconds for streaming transcription
min_chunk_size = 0.3

# Use Silero VAD filter before decoding
use_vad = true

# Decoding history control. Off is better for live dictation.
condition_on_previous_text = false

# Prompt carry-over from previous committed chunks. Off avoids loops.
use_init_prompt = false

# Hallucination guardrails
no_speech_threshold = 0.45
log_prob_threshold = -0.8
compression_ratio_threshold = 2.0
repetition_penalty = 1.05
no_repeat_ngram_size = 3
hallucination_silence_threshold = 0.8

# VAD tuning
vad_threshold = 0.5
vad_min_speech_ms = 200
vad_min_silence_ms = 250
vad_speech_pad_ms = 180

[hotkey]
# Hotkey to toggle recording (default: Alt+O)
# Examples: <alt>+o, <ctrl>+space, f12
key = <alt>+o

[behavior]
# Show desktop notification
notifications = true
