[general]
# This file is copied to ~/.config/openwhisper/config.ini.
# API keys never belong here. Add them in the Settings screen, where they are
# encrypted with a Secret-portal-derived key, or use environment variables.
notifications = false
live_insertion = false
reduced_motion = false

[transcription]
provider = faster-whisper
model = large-v3-turbo
device = auto
compute_type = auto
language = auto

[cleanup]
# raw keeps the provider transcript unchanged. clean, formal, and custom are
# opt-in and require a configured cleanup provider for rewritten text.
mode = raw
provider =
custom_prompt =

[shortcuts]
# Supported modes: toggle and push-to-talk.
dictation = <alt>+o
mode = toggle

[history]
# Raw and final text are stored locally for this many days. Use 0 to prune
# history immediately.
retention_days = 30

[modes]
# Built-in: raw, clean, formal-msa, message, email, note, and smart.
active = raw

[audio]
# Opaque Qt microphone id. Leave empty to follow the desktop default.
device_id =
# Audio retention is opt-in. When enabled, the range is 1..30 days.
retain = false
retention_days = 7
