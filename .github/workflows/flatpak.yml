name: Flatpak

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          appstream flatpak flatpak-builder libegl1 libgl1
          libxkbcommon-x11-0 libxcb-cursor0
      - name: Check application metadata and least-privilege policy
        run: |
          python3 packaging/flatpak/lint-manifest.py
          appstreamcli validate --no-net packaging/linux/io.github.yousufaltayeb.OpenWhisper.metainfo.xml
          flatpak-builder --show-manifest packaging/flatpak/io.github.yousufaltayeb.OpenWhisper.yml >/dev/null
      - name: Test Python contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install uv
          uv sync --frozen --extra dev
          uv run --frozen --extra dev ruff check src tests packaging
          uv run --frozen --extra dev pytest
          uv run --frozen --extra dev python packaging/flatpak/check-licenses.py
          uv build

  publish:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')))
    needs: validate
    runs-on: ubuntu-24.04
    # Configure required reviewers for the `stable` environment. A protected
    # version tag promotes the tested commit; main can publish beta only.
    environment: ${{ github.ref_type == 'tag' && 'stable' || 'beta' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          # KDE 6.11 inherits Python 3.13 from Freedesktop SDK 25.08. Native
          # release wheels must use the same ABI as the Flatpak builder.
          python-version: "3.13"
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          python -m pip install uv
      - name: Install KDE SDK/runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.kde.Sdk//6.11 org.kde.Platform//6.11
          sdk_python=$(flatpak run --user --command=python3 org.kde.Sdk//6.11 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          runtime_python=$(flatpak run --user --command=python3 org.kde.Platform//6.11 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          host_python=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          test "$sdk_python" = 3.13
          test "$runtime_python" = "$sdk_python"
          test "$host_python" = "$sdk_python"
      - name: Prepare pinned source cache, then prove the build is offline
        run: |
          test "$(uname -m)" = x86_64
          python3 packaging/flatpak/prepare-sources.py
          python3 packaging/flatpak/check-licenses.py --wheelhouse
          flatpak-builder --download-only build-dir packaging/flatpak/io.github.yousufaltayeb.OpenWhisper.yml
          flatpak-builder --force-clean --disable-download --repo=unsigned-repo build-dir packaging/flatpak/io.github.yousufaltayeb.OpenWhisper.yml
      - name: Require an approved stable semantic-version tag
        if: github.ref_type == 'tag'
        run: |
          printf '%s' "${{ github.ref_name }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
      - name: Preserve already published beta and stable refs
        run: |
          mkdir -p pages/repo
          if curl --fail --silent --show-error --head \
            https://yousufaltayeb.github.io/openwhisper/repo/summary >/dev/null; then
            ostree --repo=pages/repo init --mode=archive-z2
            ostree --repo=pages/repo remote add --if-not-exists \
              --gpg-import=packaging/flatpak/keys/openwhisper-public.asc \
              published https://yousufaltayeb.github.io/openwhisper/repo/
            ostree --repo=pages/repo pull --mirror --depth=-1 published
          fi
      - name: Publish signed beta or stable repository
        env:
          OPENWHISPER_GPG_PRIVATE_KEY: ${{ secrets.OPENWHISPER_GPG_PRIVATE_KEY }}
          OPENWHISPER_GPG_PASSPHRASE: ${{ secrets.OPENWHISPER_GPG_PASSPHRASE }}
          OPENWHISPER_GPG_FINGERPRINT: ${{ secrets.OPENWHISPER_GPG_FINGERPRINT }}
        run: |
          branch=beta
          if [ "${{ github.ref_type }}" = tag ]; then branch=stable; fi
          sh packaging/flatpak/publish-flatpak-repo.sh "$branch" build-dir pages
      - name: Install from the signed reference
        run: |
          branch=beta
          prior=
          if [ "${{ github.ref_type }}" = tag ]; then branch=stable; fi
          if [ "$branch" = beta ] && curl --fail --silent --show-error --head https://yousufaltayeb.github.io/openwhisper/repo/summary; then
            prior=https://yousufaltayeb.github.io/openwhisper/repo/
          fi
          sh packaging/flatpak/verify-release-repository.sh \
            "$PWD/pages/repo" \
            packaging/flatpak/keys/openwhisper-public.asc \
            "$branch" \
            "$prior" \
            "$PWD/pages/openwhisper-$branch.flatpakref"
      - name: Upload GitHub Pages repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
