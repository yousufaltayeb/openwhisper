[package]
name = "openwhisper"
version = "0.1.0"
description = "Private Tauri host for OpenWhisper"
authors = ["OpenWhisper contributors"]
edition = "2021"
rust-version = "1.77.2"

[features]
default = []
# Tauri's CLI enables this feature for production builds. Flatpak invokes
# Cargo directly, so its release command must request the same bundled-asset
# protocol explicitly instead of loading `build.devUrl`.
custom-protocol = ["tauri/custom-protocol"]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[lib]
name = "openwhisper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openwhisper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-wdio = { version = "1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.2.0", optional = true }
uuid = { version = "1.22.0", features = ["v4"] }
zbus = { version = "5.18.0", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3.26.0"
